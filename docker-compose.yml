version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bergerat
      POSTGRES_PASSWORD: bergerat_secret
      POSTGRES_DB: bergerat_kpi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bergerat -d bergerat_kpi"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://bergerat:bergerat_secret@db:5432/bergerat_kpi
      JWT_SECRET: changez-moi-en-production
      JWT_EXPIRES_IN: 24h
      PORT: "3001"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
